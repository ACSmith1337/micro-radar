; ESP8266 D1 Mini + GC9A01 round 240x240
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
lib_deps =
    lovyan03/LovyanGFX
    tzapu/WiFiManager
    d-a-v/ESP Async WebServer @ ^2.10.0
    d-a-v/ESPAsyncTCP @ ^2.0.0
    bblanchon/ArduinoJson

; Original ESP32-C3 config (preserved)
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
build_unflags =
    -std=gnu++11
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -Wall
board_build.partitions = huge_app.csv
lib_deps =
    lovyan03/LovyanGFX
    tzapu/WiFiManager
    mathieucarbou/ESP Async WebServer
    mathieucarbou/AsyncTCP
    bblanchon/ArduinoJson
